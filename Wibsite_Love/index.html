    <script nonce="">
        /* Click/Touch particle effect */
        document.addEventListener('click', spawnParticles);
        document.addEventListener('touchstart', (e) => {
            [...e.touches].forEach(t => spawnParticles({ clientX: t.clientX, clientY: t.clientY }));
        }, { passive: true });

        function spawnParticles(e) {
            const count = 8;
            const icons = ['❤️','💗','💕','💖'];
            for (let i = 0; i < count; i++) {
                const el = document.createElement('div');
                el.textContent = icons[Math.floor(Math.random() * icons.length)];
                const angle = (360 / count) * i + Math.random() * 20;
                const dist = 60 + Math.random() * 80;
                const rad = angle * Math.PI / 180;
                const dx = Math.cos(rad) * dist;
                const dy = Math.sin(rad) * dist;
                el.style.cssText = `
                    position: fixed;
                    left: ${e.clientX}px;
                    top: ${e.clientY}px;
                    font-size: ${16 + Math.random() * 18}px;
                    pointer-events: none;
                    z-index: 9999;
                    transform: translate(-50%, -50%);
                    transition: all 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94);
                    opacity: 1;
                `;
                document.body.appendChild(el);
                requestAnimationFrame(() => requestAnimationFrame(() => {
                    el.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(0)`;
                    el.style.opacity = '0';
                }));
                setTimeout(() => el.remove(), 900);
            }
        }

        /* Dynamic floating hearts */
        const heartIcons = ['❤️','💗','💕','💖'];
/* حارس: مايزيدش عن 24 عنصر في نفس الوقت، وبيقف لما الصفحة
           تبقى في الخلفية (تاب تاني) — بيوفر بطارية ومعالج. */
        const MAX_FLOATS = 24;
        setInterval(() => {
            if (document.hidden) return;          // التاب في الخلفية
            const box = document.getElementById('floatsContainer');
            if (box && box.childElementCount >= MAX_FLOATS) return;   // اتكوّموا كفاية
            for (let i = 0; i < 3; i++) {
                const el = document.createElement('div');
                el.className = 'float-item';
                el.textContent = heartIcons[Math.floor(Math.random() * heartIcons.length)];
                el.style.left = Math.random() * 100 + '%';
                el.style.fontSize = (Math.random() * 14 + 28) + 'px';
                el.style.animationDuration = (Math.random() * 5 + 8) + 's';
                el.style.animationDelay = (Math.random() * 0.8) + 's';
                el.style.opacity = '0';
                document.getElementById('floatsContainer').appendChild(el);
                setTimeout(() => el.remove(), 15000);
            }
        }, 600);
    </script>
